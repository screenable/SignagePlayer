# Screenable-Kiosk mit öffentlich zugänglicher Tastatur: kein Wechsel auf
# Textkonsolen (Strg+Alt+F1..F12) und kein Beenden des X-Servers per Tastenkürzel.
# Für Wartung am Gerät diese Datei entfernen und neu starten; SSH bleibt unberührt.
Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "DontZap"      "true"
EndSection
