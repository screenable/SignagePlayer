services:
  dashboard:
    build: .
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - screenable-data:/data
    tmpfs:
      - /runtime:uid=1000,gid=1000,mode=0770
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  screenable-data:
